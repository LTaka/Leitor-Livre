<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Leitor Livre</title>
<style>
:root{--bg:#f3f7f5;--surface:#fff;--surface-2:#eef5f1;--line:#dbe8e2;--text:#16352f;--muted:#5f7a70;--brand:#0e7866;--brand-strong:#0a5f51;--brand-soft:#e2f1ea;--brand-ink:#0f6a5a;--ring:#85cdb7;--shadow:0 2px 10px rgba(20,70,58,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--surface:#16211e;--surface-2:#1c2a26;--line:#283a35;--text:#e4efeb;--muted:#93aaa2;--brand:#21a088;--brand-strong:#3cb89f;--brand-soft:#1d3530;--brand-ink:#8fdcc9;--ring:#3d8f7c;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;width:290px;padding:14px;font:14px/1.5 system-ui,sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:10px 12px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;transition:background .15s}
button:hover{background:var(--brand-strong)}
button:disabled{opacity:.5;cursor:default}
button.secondary{background:var(--brand-soft);color:var(--brand-ink)}
button.secondary:hover:not(:disabled){background:var(--line)}
button svg{width:16px;height:16px;flex:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.muted{font-size:12px;color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.top h1{font-size:16px;margin:0;line-height:1.2}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.state{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.state b{display:block;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
body.active .dot{background:var(--brand);animation:pulse 1.2s ease-in-out infinite}
body.paused .dot{background:#d79a2b;animation:none}
@keyframes pulse{50%{opacity:.35}}
.actions{display:grid;grid-template-columns:1fr auto;gap:6px}
.actions #goto{width:42px;padding:0}
.setting{display:flex;align-items:center;gap:10px;cursor:pointer}
.setting span{flex:1}
.setting b{display:block}
input.switch{appearance:none;flex:none;width:40px;height:23px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
input.switch:checked{background:var(--brand)}
input.switch:checked::after{transform:translateX(17px)}
#open{margin-top:10px;padding:11px}
.keys{margin:10px 2px 0;display:grid;gap:4px}
.keys div{display:flex;justify-content:space-between;align-items:center}
kbd{font:600 10px/1 ui-monospace,monospace;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 4px}
</style></head><body>
<header class="top">
  <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg></div>
  <div><h1>Leitor Livre</h1><div class="muted">Seu texto, no seu ritmo.</div></div>
</header>

<section class="card" aria-live="polite">
  <div class="state"><span class="dot" aria-hidden="true"></span><div><b id="title">Nada tocando</b><span class="muted" id="status">Selecione um texto para ouvir.</span></div></div>
  <div class="actions">
    <button id="toggle" class="secondary" disabled><svg id="toggle-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span id="toggle-label">Pausar</span></button>
    <button id="goto" class="secondary" title="Ir para a aba da leitura" aria-label="Ir para a aba da leitura" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
  </div>
</section>

<section class="card">
  <label class="setting"><span><b>Leitura automática</b><span class="muted" id="auto-hint">Selecionar texto inicia a leitura.</span></span><input id="automatic" class="switch" type="checkbox"></label>
</section>

<button id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>Abrir painel lateral</button>

<div class="keys muted">
  <div><span>Ler seleção</span><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></span></div>
  <div><span>Acrescentar à leitura</span><span><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd></span></div>
</div>
<script src="popup.js"></script></body></html>
